<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>正弦波 干渉縞＆音響波形 ビジュアライザー</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">
  <div class="max-w-4xl mx-auto px-4 py-8">
    <h1 class="text-3xl font-bold text-center text-purple-400 mb-2">正弦波 干渉＆波形ビジュアライザー</h1>
    <p class="text-center text-gray-400 mb-8">2つの正弦波の干渉・うなり・リサージュ曲線をリアルタイム可視化</p>

    <div class="grid grid-cols-2 gap-6 mb-6">
      <!-- Wave 1 controls -->
      <div class="bg-gray-800 rounded-xl p-4">
        <h2 class="text-sm font-bold text-blue-400 mb-3">波1 (青)</h2>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-400 flex justify-between" for="f1">
              周波数 <span id="f1val" class="text-blue-300"></span>
            </label>
            <input id="f1" type="range" min="1" max="500" value="220" class="w-full accent-blue-500" aria-label="波1の周波数">
          </div>
          <div>
            <label class="text-xs text-gray-400 flex justify-between" for="a1">
              振幅 <span id="a1val" class="text-blue-300"></span>
            </label>
            <input id="a1" type="range" min="0" max="100" value="80" class="w-full accent-blue-500" aria-label="波1の振幅">
          </div>
          <div>
            <label class="text-xs text-gray-400 flex justify-between" for="p1">
              位相 (°) <span id="p1val" class="text-blue-300"></span>
            </label>
            <input id="p1" type="range" min="0" max="360" value="0" class="w-full accent-blue-500" aria-label="波1の位相">
          </div>
        </div>
      </div>
      <!-- Wave 2 controls -->
      <div class="bg-gray-800 rounded-xl p-4">
        <h2 class="text-sm font-bold text-red-400 mb-3">波2 (赤)</h2>
        <div class="space-y-3">
          <div>
            <label class="text-xs text-gray-400 flex justify-between" for="f2">
              周波数 <span id="f2val" class="text-red-300"></span>
            </label>
            <input id="f2" type="range" min="1" max="500" value="223" class="w-full accent-red-500" aria-label="波2の周波数">
          </div>
          <div>
            <label class="text-xs text-gray-400 flex justify-between" for="a2">
              振幅 <span id="a2val" class="text-red-300"></span>
            </label>
            <input id="a2" type="range" min="0" max="100" value="80" class="w-full accent-red-500" aria-label="波2の振幅">
          </div>
          <div>
            <label class="text-xs text-gray-400 flex justify-between" for="p2">
              位相 (°) <span id="p2val" class="text-red-300"></span>
            </label>
            <input id="p2" type="range" min="0" max="360" value="0" class="w-full accent-red-500" aria-label="波2の位相">
          </div>
        </div>
      </div>
    </div>

    <div class="bg-gray-800 rounded-xl p-4 mb-4 flex items-center justify-between">
      <div class="text-center">
        <p class="text-xs text-gray-400">うなり周波数</p>
        <p id="beatFreq" class="text-2xl font-bold text-green-400"></p>
      </div>
      <button id="playBtn" aria-label="合成音を再生する"
        class="bg-purple-600 hover:bg-purple-700 text-white px-6 py-3 rounded-lg font-bold transition">▶ 再生</button>
      <button id="stopAudioBtn" aria-label="音を停止する"
        class="bg-gray-600 hover:bg-gray-500 text-white px-6 py-3 rounded-lg font-bold transition">■ 停止</button>
    </div>

    <div class="bg-gray-800 rounded-xl p-4 mb-4">
      <p class="text-xs text-gray-400 mb-2">波形 (青=波1 / 赤=波2 / 緑=合成)</p>
      <canvas id="waveCanvas" width="760" height="180" class="w-full rounded-lg" aria-label="波形グラフ"></canvas>
    </div>

    <div class="bg-gray-800 rounded-xl p-4">
      <p class="text-xs text-gray-400 mb-2">リサージュ曲線 (X=波1 / Y=波2)</p>
      <canvas id="lissajousCanvas" width="300" height="300" class="block mx-auto rounded-lg" aria-label="リサージュ曲線"></canvas>
    </div>
  </div>

  <script>
    let animFrame = null;
    let phase = 0;
    let audioCtx = null;
    let osc1 = null, osc2 = null, gain1 = null, gain2 = null;
    let isPlaying = false;

    function getParams() {
      return {
        f1: parseInt(document.getElementById('f1').value),
        a1: parseInt(document.getElementById('a1').value) / 100,
        p1: parseInt(document.getElementById('p1').value) * Math.PI / 180,
        f2: parseInt(document.getElementById('f2').value),
        a2: parseInt(document.getElementById('a2').value) / 100,
        p2: parseInt(document.getElementById('p2').value) * Math.PI / 180,
      };
    }

    function updateLabels() {
      const p = getParams();
      document.getElementById('f1val').textContent = p.f1 + ' Hz';
      document.getElementById('a1val').textContent = (p.a1 * 100).toFixed(0) + '%';
      document.getElementById('p1val').textContent = document.getElementById('p1').value + '°';
      document.getElementById('f2val').textContent = p.f2 + ' Hz';
      document.getElementById('a2val').textContent = (p.a2 * 100).toFixed(0) + '%';
      document.getElementById('p2val').textContent = document.getElementById('p2').value + '°';
      document.getElementById('beatFreq').textContent = Math.abs(p.f1 - p.f2) + ' Hz';
    }

    function drawWave() {
      const p = getParams();
      const canvas = document.getElementById('waveCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 0, W, H);

      // Grid
      ctx.strokeStyle = '#374151'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();

      const N = W;
      const timeSpan = 1 / Math.min(p.f1, p.f2, 1) * 3;

      function drawSingleWave(freq, amp, phaseShift, color) {
        ctx.strokeStyle = color; ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < N; i++) {
          const t = (i / N) * timeSpan + phase;
          const y = H / 2 - amp * (H / 2 - 10) * Math.sin(2 * Math.PI * freq * t + phaseShift);
          i === 0 ? ctx.moveTo(i, y) : ctx.lineTo(i, y);
        }
        ctx.stroke();
      }

      drawSingleWave(p.f1, p.a1, p.p1, '#60a5fa');
      drawSingleWave(p.f2, p.a2, p.p2, '#f87171');

      // Composite
      ctx.strokeStyle = '#4ade80'; ctx.lineWidth = 2.5;
      ctx.beginPath();
      for (let i = 0; i < N; i++) {
        const t = (i / N) * timeSpan + phase;
        const y = H / 2 - ((
          p.a1 * Math.sin(2 * Math.PI * p.f1 * t + p.p1) +
          p.a2 * Math.sin(2 * Math.PI * p.f2 * t + p.p2)
        ) / 2) * (H / 2 - 10);
        i === 0 ? ctx.moveTo(i, y) : ctx.lineTo(i, y);
      }
      ctx.stroke();
    }

    function drawLissajous() {
      const p = getParams();
      const canvas = document.getElementById('lissajousCanvas');
      const ctx = canvas.getContext('2d');
      const W = canvas.width, H = canvas.height;
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#111827';
      ctx.fillRect(0, 0, W, H);

      ctx.strokeStyle = '#a78bfa'; ctx.lineWidth = 1.5;
      ctx.beginPath();
      const N = 2000;
      const dur = Math.min(10, 1 / Math.max(Math.abs(p.f1 - p.f2), 0.1));
      for (let i = 0; i < N; i++) {
        const t = (i / N) * dur + phase;
        const x = W / 2 + (p.a1 * (W / 2 - 10)) * Math.sin(2 * Math.PI * p.f1 * t + p.p1);
        const y = H / 2 - (p.a2 * (H / 2 - 10)) * Math.sin(2 * Math.PI * p.f2 * t + p.p2);
        i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
    }

    function animate() {
      phase += 0.005;
      updateLabels();
      drawWave();
      drawLissajous();
      animFrame = requestAnimationFrame(animate);
    }

    document.querySelectorAll('input[type=range]').forEach(el => {
      el.addEventListener('input', () => {
        updateLabels();
        if (isPlaying) updateAudio();
      });
    });

    function startAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      const p = getParams();
      gain1 = audioCtx.createGain();
      gain2 = audioCtx.createGain();
      osc1 = audioCtx.createOscillator();
      osc2 = audioCtx.createOscillator();
      osc1.frequency.value = Math.min(p.f1, 500);
      osc2.frequency.value = Math.min(p.f2, 500);
      gain1.gain.value = p.a1 * 0.3;
      gain2.gain.value = p.a2 * 0.3;
      osc1.connect(gain1); gain1.connect(audioCtx.destination);
      osc2.connect(gain2); gain2.connect(audioCtx.destination);
      osc1.start(); osc2.start();
      isPlaying = true;
    }

    function updateAudio() {
      const p = getParams();
      if (osc1) osc1.frequency.value = Math.min(p.f1, 500);
      if (osc2) osc2.frequency.value = Math.min(p.f2, 500);
      if (gain1) gain1.gain.value = p.a1 * 0.3;
      if (gain2) gain2.gain.value = p.a2 * 0.3;
    }

    function stopAudio() {
      if (osc1) { try { osc1.stop(); } catch(e) {} osc1 = null; }
      if (osc2) { try { osc2.stop(); } catch(e) {} osc2 = null; }
      gain1 = null; gain2 = null;
      isPlaying = false;
    }

    document.getElementById('playBtn').addEventListener('click', () => {
      if (isPlaying) stopAudio();
      startAudio();
    });

    document.getElementById('stopAudioBtn').addEventListener('click', stopAudio);

    updateLabels();
    animate();
  </script>
</body>
</html>
